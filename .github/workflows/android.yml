name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (import engine)
        run: ./gradlew :core:test

      - name: Build debug APK and run app unit tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Compiler errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|error:|\[ksp\]|What went wrong" -A2 build.log | sed "s#file://$GITHUB_WORKSPACE/app/src/main/java/com/mundymorning/touchmusic/##" | head -150 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: touch-music-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            core/build/test-results
            app/build/reports/tests
          if-no-files-found: ignore
